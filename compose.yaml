services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tactix
      POSTGRES_PASSWORD: tactix
      POSTGRES_DB: tactix
    ports:
      - "${TACTIX_POSTGRES_PORT:-5432}:5432"
    volumes:
      - tactix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tactix"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      # Reach the db service by name inside the compose network.
      TACTIX_DATABASE_URL: postgresql+psycopg://tactix:tactix@db:5432/tactix
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  tactix_pgdata:

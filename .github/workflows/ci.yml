name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tactix
          POSTGRES_PASSWORD: tactix
          POSTGRES_DB: tactix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tactix -d tactix_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TACTIX_TEST_DATABASE_URL: postgresql+psycopg://tactix:tactix@localhost:5432/tactix_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync --locked --dev --extra agents
      - run: uv run --extra agents ruff check .
      - name: Unit tests
        run: uv run --extra agents pytest -q -m 'not integration'
      - name: HTTP/SSE integration tests
        run: timeout 90s uv run --extra agents pytest -vv -m integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  recording-windows:
    runs-on: windows-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync --locked --dev
      - run: uv run python -m tactix.demo.recording verify ../data/recordings/ashford-demo-v1 --regenerate
      - run: uv run pytest tests/unit/test_recording.py -q

  demo-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --dev
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-browser-diagnostics
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

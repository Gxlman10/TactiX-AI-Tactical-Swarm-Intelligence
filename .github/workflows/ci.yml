name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tactix
          POSTGRES_PASSWORD: tactix
          POSTGRES_DB: tactix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tactix -d tactix_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TACTIX_TEST_DATABASE_URL: postgresql+psycopg://tactix:tactix@localhost:5432/tactix_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync --locked --dev --extra agents
      - run: uv run --extra agents ruff check .
      - run: uv run --extra agents pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

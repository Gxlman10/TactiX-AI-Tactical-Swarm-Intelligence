[project]
name = "tactix"
version = "0.1.0"
description = "A swarm of specialist AI agents that turns synthetic football events into explainable match intelligence."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "sse-starlette>=2.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Microsoft Agent Framework + Foundry live here so the base env always installs even while
# these preview packages settle. Install with: uv sync --extra agents
agents = [
    "agent-framework-core==1.19.0",
    "agent-framework-foundry==1.13.1",
    "azure-identity>=1.19",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tactix"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: exercises the real HTTP/SSE socket boundary",
]
